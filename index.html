
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boletim Digital - 8º Ano</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- Cabeçalho Principal -->
    <header class="header">
      <div class="logo-tag">JDM DRIFT EDITION</div>
      <h1>Boletim Digital</h1>
      <p class="subtitle">8º Ano — Ensino Fundamental</p>
      <p class="student-name">Estudante: <span>Estudante Exemplo</span></p>
    </header>

    <!-- Área de Cards de Resumo -->
    <section class="cards-grid">
      <div class="card">
        <h3>Média Geral</h3>
        <p id="card-media" class="card-value">—</p>
      </div>

      <div class="card">
        <h3>Total de Faltas</h3>
        <p id="card-faltas" class="card-value">—</p>
      </div>

      <div class="card">
        <h3>Bom Desempenho</h3>
        <p id="card-bom" class="card-value">—</p>
      </div>

      <div class="card">
        <h3>Precisa de Atenção</h3>
        <p id="card-atencao" class="card-value">—</p>
      </div>

      <div class="card highlight">
        <h3>Frequência</h3>
        <p id="card-frequencia" class="card-value">92%</p>
        <span class="card-status">Frequência adequada</span>
      </div>
    </section>

    <!-- Tabela de Disciplinas -->
    <section class="table-container">
      <h2>Desempenho por Disciplina</h2>
      <table>
        <thead>
          <tr>
            <th>Disciplina</th>
            <th>1º Tri</th>
            <th>2º Tri</th>
            <th>3º Tri</th>
            <th>Média</th>
            <th>Faltas</th>
            <th>Situação</th>
          </tr>
        </thead>
        <tbody id="tabela-corpo">
          <!-- As 15 disciplinas serão inseridas aqui automaticamente pelo JavaScript -->
        </tbody>
      </table>
    </section>
  </div>

  <!-- Conectando o arquivo JavaScript -->
  <script src="script.js"></script>
</body>
</html>
